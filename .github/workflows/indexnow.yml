name: IndexNow
on:
  push:
    branches: [main]
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Wait for GitHub Pages to deploy
        run: sleep 90
      - name: Notify IndexNow (Bing, Yandex and others)
        run: |
          if [ -z "$(git diff --name-only HEAD~1 HEAD -- '*.html')" ]; then echo "No page changes"; exit 0; fi
          URLS=$(git diff --name-only HEAD~1 HEAD -- '*.html' | while read f; do [ "$f" = "index.html" ] && f=""; printf '"https://peptidediscount.github.io/%s",' "$f"; done | sed 's/,$//')
          BODY="{\"host\":\"peptidediscount.github.io\",\"key\":\"a45f3a7e7bce676e6c3c66052a63f820\",\"keyLocation\":\"https://peptidediscount.github.io/a45f3a7e7bce676e6c3c66052a63f820.txt\",\"urlList\":[$URLS]}"
          echo "$BODY" | head -c 600
          curl -sS -o /dev/null -w "IndexNow HTTP %{http_code}\n" -X POST "https://api.indexnow.org/indexnow" -H "Content-Type: application/json; charset=utf-8" -d "$BODY"
